<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>T07 — Everyday Editorial / LayerFit</title>
  <style>/* LayerFit T07 / Everyday Editorial v2
   Minimal, image-led retail creative.  No AI-generated artwork. */
:root { color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #e6e2db; }
body { font-family: Arial, Helvetica, sans-serif; }
.ad {
  --paper: #f4f2ed;
  --ink: #171b19;
  --photo-position: 50% 50%;
  width: 1080px;
  height: 1080px;
  background: var(--paper);
  color: var(--ink);
  position: relative;
  overflow: hidden;
  isolation: isolate;
}
.masthead {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 106px;
  padding: 0 55px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.brand { display: flex; align-items: center; min-height: 42px; }
#brand-name { font-size: 35px; font-weight: 900; letter-spacing: -2.1px; line-height: 1; }
#brand-logo { max-width: 260px; max-height: 58px; object-fit: contain; }
.category { font-size: 17px; font-weight: 700; letter-spacing: .16em; }
.photograph {
  position: absolute;
  top: 106px;
  left: 55px;
  right: 55px;
  height: 650px;
  margin: 0;
  background: #c6c4bf;
  overflow: hidden;
}
.photograph img {
  width: 100%; height: 100%; display: block;
  object-fit: cover; object-position: var(--photo-position);
}
.copy { position: absolute; left: 55px; right: 55px; top: 797px; bottom: 49px; }
.copy h1 {
  font-family: Arial, Helvetica, sans-serif;
  font-size: 84px;
  font-weight: 800;
  line-height: .99;
  letter-spacing: -.065em;
  margin: 0;
  max-width: 100%;
  overflow-wrap: break-word;
}
.bottomline {
  display: flex; align-items: end; justify-content: space-between;
  position: absolute; bottom: 0; left: 0; right: 0;
  gap: 20px;
}
.bottomline p { font-size: 25px; line-height: 1.28; margin: 0; max-width: 540px; }
.cta {
  min-width: 286px; height: 72px; background: var(--ink); color: var(--paper);
  padding: 0 21px 0 27px;
  display: flex; align-items: center; justify-content: space-between; gap: 24px;
  font-size: 18px; letter-spacing: .045em; font-weight: 800;
  white-space: nowrap;
}
.cta .arrow { font-size: 31px; line-height: 1; font-weight: 400; }
/* 4:5 portrait — taller photograph, restrained bottom copy */
.ad[data-format="portrait"] { height: 1350px; }
.ad[data-format="portrait"] .photograph { height: 898px; }
.ad[data-format="portrait"] .copy { top: 1048px; bottom: 56px; }
.ad[data-format="portrait"] .copy h1 { font-size: 86px; }
.ad[data-format="portrait"] .bottomline p { font-size: 25px; }
/* 9:16 stories — intentional safe zones top 180 / bottom 205 */
.ad[data-format="story"] { height: 1920px; }
.ad[data-format="story"] .masthead { top: 155px; height: 85px; }
.ad[data-format="story"] .photograph { top: 255px; height: 1020px; }
.ad[data-format="story"] .copy { top: 1325px; bottom: 220px; }
.ad[data-format="story"] .copy h1 { font-size: 103px; max-width: 890px; line-height: 1.04; }
.ad[data-format="story"] .bottomline { align-items: start; flex-direction: column; gap: 28px; }
.ad[data-format="story"] .bottomline p { font-size: 29px; }
.ad[data-format="story"] .cta { min-width: 390px; height: 92px; font-size: 23px; }
</style>
</head>

    <section class="copy">
      <h1 id="headline">In huis. In gebruik.</h1>
      <div class="bottomline">
        <p id="description">Bekijk Product A van dichtbij.</p>
        <div class="cta" aria-label="Call to action">
          <span id="cta-text">BEKIJK PRODUCT</span>

  <script>/* T07 / minimal DOM data binding. All copy uses textContent, not innerHTML. */
(() => {
  const root = document.querySelector('#creative');
  const photo = document.querySelector('#product-photo');
  const brandName = document.querySelector('#brand-name');
  const logo = document.querySelector('#brand-logo');
  const headline = document.querySelector('#headline');
  const description = document.querySelector('#description');
  const cta = document.querySelector('#cta-text');
  const category = document.querySelector('#category');
  const allowedFormats = ['square', 'portrait', 'story'];

  function fitHeadline() {
    const limits = { square: [84, 55], portrait: [86, 55], story: [103, 62] };
    const [max, min] = limits[root.dataset.format] || limits.square;
    headline.style.fontSize = max + 'px';
    const copy = document.querySelector('.copy');
    const bottom = document.querySelector('.bottomline');
    // Headline should stay above the CTA/description area.
    for (let n = max; n >= min; n -= 2) {
      headline.style.fontSize = n + 'px';
      const heightAvailable = bottom.getBoundingClientRect().top - headline.getBoundingClientRect().top - 12;
      if (headline.scrollWidth <= headline.clientWidth + 1 && headline.scrollHeight <= heightAvailable + 1) return true;
    }
    return false;
  }

  async function ensureImageLoaded(img) {
    if (!img.hidden && img.src) {
      if (!img.complete) await new Promise((resolve, reject) => {
        img.addEventListener('load', resolve, { once: true });
        img.addEventListener('error', () => reject(new Error('Unable to load image')), { once: true });
      });
      if (!img.naturalWidth) throw new Error('Invalid image');
    }
  }

  window.setCreative = async function setCreative(data = {}) {
    const format = allowedFormats.includes(data.format) ? data.format : 'square';
    root.dataset.format = format;
    if (typeof data.brand === 'string') brandName.textContent = data.brand;
    if (typeof data.category === 'string') category.textContent = data.category;
    if (typeof data.headline === 'string') headline.textContent = data.headline;
    if (typeof data.description === 'string') description.textContent = data.description;
    if (typeof data.cta === 'string') cta.textContent = data.cta;
    if (typeof data.imageAlt === 'string') photo.alt = data.imageAlt;
    if (typeof data.imageUrl === 'string' && data.imageUrl) photo.src = data.imageUrl;
    if (typeof data.logoUrl === 'string' && data.logoUrl) {
      logo.src = data.logoUrl;
      logo.hidden = false;
      brandName.hidden = true;
    } else { logo.hidden = true; brandName.hidden = false; }
    const c = data.colors || {};
    if (typeof c.paper === 'string' && /^#[0-9a-f]{6}$/i.test(c.paper)) root.style.setProperty('--paper', c.paper);
    if (typeof c.ink === 'string' && /^#[0-9a-f]{6}$/i.test(c.ink)) root.style.setProperty('--ink', c.ink);
    if (typeof data.imagePosition === 'string' && /^(\d{1,3}%\s+\d{1,3}%)$/.test(data.imagePosition)) {
      root.style.setProperty('--photo-position', data.imagePosition);
    }
    await ensureImageLoaded(photo);
    await ensureImageLoaded(logo);
    await document.fonts.ready;
    await new Promise(requestAnimationFrame);
    const fits = fitHeadline();
    return { ok: fits, format };
  };

  // Standalone preview, no AI or server necessary.
  window.setCreative({ format: new URLSearchParams(location.search).get('format') || 'square' });
})();
</script>
