/* ============================================================
   TEMPLATE 02 — IKLAN PERBANDINGAN (SPLIT SCREEN) "TONI HOMI"
   Replika template iklan e-commerce: panel kiri vs panel kanan
   ------------------------------------------------------------
   Cara kustomisasi cepat: ubah nilai variabel di :root
   ============================================================ */

:root {
  --bg-page: #1d1d1d;        /* warna latar halaman (di luar iklan) */
  --text-light: #ffffff;     /* teks terang di atas foto */
  --tag-bg: #ffffff;         /* latar label pil (Ander merk / Toni Homi) */
  --tag-text: #1a1a1a;       /* teks di dalam label pil */
  --con-red: #d42b1e;        /* warna ikon silang (kekurangan) */
  --pro-green: #3da639;      /* warna ikon centang (kelebihan) */
  --badge-bg: #222222;       /* latar logo T */
  --divider: #ffffff;        /* garis pembatas antar panel */
  --shade-strength: 0.82;    /* kepekatan gradasi bawah (0-1) */

  --font-head: 'Montserrat', 'Poppins', 'Segoe UI', Arial, sans-serif;
  --font-body: 'Poppins', 'Segoe UI', Arial, sans-serif;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: var(--font-body);
  background: var(--bg-page);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 28px 14px;
}

/* ============ CONTAINER UTAMA ============ */

.ad {
  width: min(960px, 100%);
  aspect-ratio: 1 / 1;             /* iklan berbentuk persegi */
  display: flex;
  box-shadow: 0 20px 55px rgba(0, 0, 0, 0.5);
}

.ad__divider {
  width: 6px;                      /* garis putih vertikal */
  background: var(--divider);
  flex-shrink: 0;
}

/* ============ PANEL (dipakai kiri & kanan) ============ */

.panel {
  position: relative;
  flex: 1;
  overflow: hidden;
  container-type: inline-size;     /* agar ukuran teks bisa memakai cqw */
}

.panel__photo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 50% 50%;
}

/* panel kiri: fokus crop ke aksi tangan + nosel (x~63%) */
.panel--competitor .panel__photo {
  object-position: 63% 50%;
}

/* panel kanan: foto wanita menyedot sofa (crop tengah) */
.panel__photo--brand {
  object-position: 50% 50%;
}

/* ---- gradasi gelap agar teks putih tetap terbaca ---- */

.panel__shade {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.panel__shade--top {
  background: linear-gradient(
    180deg,
    rgba(0, 0, 0, 0.72) 0%,
    rgba(0, 0, 0, 0.3) 22%,
    rgba(0, 0, 0, 0) 42%
  );
}

.panel__shade--bottom {
  background: linear-gradient(
    0deg,
    rgba(0, 0, 0, var(--shade-strength)) 0%,
    rgba(0, 0, 0, calc(var(--shade-strength) * 0.55)) 32%,
    rgba(0, 0, 0, 0) 60%
  );
}

/* ============ SLOGAN (kiri atas) ============ */

.slogan {
  position: absolute;
  top: 7cqw;
  left: 7cqw;
  right: 7cqw;
  font-family: var(--font-head);
  text-transform: uppercase;
  color: var(--text-light);
  font-size: 34px;
  font-size: 7cqw;                 /* fallback px, lalu skala mengikuti panel */
  line-height: 1.16;
  letter-spacing: 0.5px;
  text-shadow: 0 1px 8px rgba(0, 0, 0, 0.35);
}

.slogan__line {
  display: block;
  font-weight: 400;                /* 2 baris pertama ringan */
}

.slogan__line--brand {
  font-weight: 800;                /* nama merek tebal */
}

/* ============ LABEL PIL ============ */

.tag {
  display: inline-block;
  background: var(--tag-bg);
  color: var(--tag-text);
  font-family: var(--font-head);
  font-weight: 700;
  font-size: 16px;
  font-size: 3.5cqw;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  line-height: 1;
  padding: 0.9em 1.15em;
  border-radius: 8px;
}

/* ============ LOGO MEREK "T" (kanan atas) ============ */

.brand-badge {
  position: absolute;
  top: 6.5cqw;
  right: 6.5cqw;
  width: 64px;
  width: 13cqw;
  height: 64px;
  height: 13cqw;
  background: var(--badge-bg);
  border-radius: 50%;
  box-shadow: 0 0 0 3px #ffffff,   /* cincin putih */
              0 4px 14px rgba(0, 0, 0, 0.35);
  display: grid;
  place-items: center;
  font-family: var(--font-head);
  font-weight: 800;
  font-size: 34px;
  font-size: 7cqw;
  color: #ffffff;
}

/* ============ FOTO PRODUK ROBOT (lingkaran, kanan bawah) ============ */

.robot-callout {
  position: absolute;
  right: 7cqw;
  bottom: 7cqw;
  width: 130px;
  width: 26cqw;
  aspect-ratio: 1 / 1;
  border-radius: 50%;
  overflow: hidden;
  border: 3px solid #ffffff;      /* cincin putih, senada dengan logo T */
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
  margin: 0;
}

.robot-callout img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* ============ BLOK BAWAH: LABEL + DAFTAR ============ */

.panel__bottom {
  position: absolute;
  left: 6.5cqw;
  right: 6.5cqw;
  bottom: 7cqw;
}

/* panel kanan: beri ruang agar teks tidak menabrak foto robot */
.panel--brand .panel__bottom {
  right: 39cqw;
}

.points {
  list-style: none;
  margin-top: 1.2em;
  display: flex;
  flex-direction: column;
  gap: 0.75em;
}

.point {
  display: flex;
  align-items: center;
  gap: 0.65em;
  color: var(--text-light);
  font-size: 19px;
  font-size: 4.1cqw;
  font-weight: 500;
  text-shadow: 0 1px 6px rgba(0, 0, 0, 0.45);
}

.point__icon {
  width: 22px;
  width: 4.7cqw;
  height: 22px;
  height: 4.7cqw;
  flex-shrink: 0;
}

.point__glyph {
  fill: none;
  stroke-width: 4;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ikon silang merah (panel kiri) & centang hijau (panel kanan) */
.point--con .point__glyph { stroke: var(--con-red); }
.point--pro .point__glyph { stroke: var(--pro-green); }

/* ============ RESPONSIVE ============ */

/* layar sempit: panel ditumpuk vertikal */
@media (max-width: 719px) {
  .ad {
    aspect-ratio: auto;
    flex-direction: column;
  }

  .ad__divider {
    width: 100%;
    height: 6px;                   /* garis jadi horizontal */
  }

  .panel {
    min-height: 620px;
  }
}

/* mode print/screenshot: hilangkan padding halaman */
@media print {
  body { padding: 0; background: none; }
  .ad { box-shadow: none; }
}
