<style>*,*::before,*::after{box-sizing:border-box;animation:none!important;transition:none!important;caret-color:transparent!important}
html,body{margin:0;padding:0;width:1080px;height:1920px;overflow:hidden;background:#ffffff}
[data-canvas]{position:relative;display:block;width:1080px;height:1920px;overflow:hidden;
--lf-canvas-w:1080px;--lf-canvas-h:1920px;--lf-safe-top:250px;--lf-safe-right:70px;--lf-safe-bottom:350px;--lf-safe-left:70px;
--lf-brand-primary:#f6f5f1;--lf-brand-secondary:#e8e6df;--lf-brand-accent:#252b27;
--lf-font-heading:"LF Arimo", sans-serif;--lf-font-body:"LF Arimo", sans-serif}</style>
<style>/* LayerFit T20: balanced radial benefit composition, not website UI. */
.lf-circular-product-benefits {
  --bg: var(--lf-brand-primary);
  --bg2: var(--lf-brand-secondary);
  --title: var(--lf-brand-accent);
  --sub: #373a36;
  --ring: #b8b4a9;
  --accent: #ece7dc;
  --brand-font: var(--lf-font-heading);
  position: relative;
  width: 100%; height: 100%;
  overflow: hidden;
  color: var(--title);
  background: linear-gradient(155deg, var(--bg) 0%, var(--bg2) 100%);
  isolation: isolate;
}
.lf-circular-product-benefits .ambient {
  position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 650px 650px at 50% 55%, rgba(255,255,255,.095), transparent 72%),
    radial-gradient(ellipse 480px 420px at 4% 1%, rgba(255,255,255,.11), transparent 70%);
}
.lf-circular-product-benefits .brand-zone {
  position: absolute; z-index: 7; left: 0; right: 0; top: 58px;
  display: flex; align-items: center; flex-direction: column; gap: 5px;
  text-align: center;
}
.lf-circular-product-benefits .brand {
  font-family: var(--brand-font); font-size: calc(86px * var(--lf-fit-t20-brand,1)); font-weight: 900;
  letter-spacing: -.075em; line-height: .99; color: var(--title);
  text-shadow: 0 5px 0 rgba(0,0,0,.085);
}
.lf-circular-product-benefits .product-type {
  font-size: calc(16px * var(--lf-fit-t20-headline,1)); font-weight: 700; line-height: 1.15;
  letter-spacing: .17em; color: var(--sub);
  text-transform: uppercase;
}
.lf-circular-product-benefits .hero { position: absolute; inset: 0; }
.lf-circular-product-benefits .hero-halo {
  position: absolute; left: 50%; top: 61%; width: 570px; height: 570px;
  transform: translate(-50%,-50%); border-radius: 50%;
  background: radial-gradient(circle, rgba(255,251,222,.19) 0%, rgba(255,251,222,.09) 42%, transparent 73%);
  pointer-events: none;
}
.lf-circular-product-benefits .orbit {
  position: absolute; width: 604px; height: 604px;
  border-radius: 50%; border: 3px solid var(--ring);
  left: 50%; top: 60%; transform: translate(-50%,-50%);
  opacity: .85; pointer-events: none;
  box-shadow: 0 0 0 1px rgba(255,255,255,.04) inset;
  /* Four balanced arc sections. Gaps prevent the orbit from crossing labels. */
  -webkit-mask: conic-gradient(from 0deg,
    transparent 0deg 16deg, #000 16deg 74deg,
