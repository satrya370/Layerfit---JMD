<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LayerFit — T06 / Question Hook</title>
  <style>:root {
  --paper: #f5f0e7;
  --ink: #1c3129;
  --accent: #ef6744;
  --line: #b9b7a9;
  --photo-bg: #e9e7df;
}
* { box-sizing: border-box; }
html, body { margin:0; padding:0; width:100%; min-height:100%; background:#b7b7b7; }
body { font-family: Arial, Helvetica, sans-serif; -webkit-font-smoothing: antialiased; }
.creative { width:1080px; height:1080px; position:relative; overflow:hidden; margin:0 auto; background:var(--paper); color:var(--ink); isolation:isolate; }
.creative::before { content:""; position:absolute; inset:0; pointer-events:none; opacity:.25; z-index:-1; background-image: radial-gradient(#9f9589 .5px, transparent .7px); background-size:9px 9px; }
.masthead { height:96px; position:absolute; left:58px; right:58px; top:0; display:flex; align-items:center; justify-content:space-between; border-bottom:2px solid var(--ink); }
.brand-lockup {display:flex;align-items:center; max-width:540px;}
.brand-logo {max-width:330px;max-height:55px;width:auto;height:auto;object-fit:contain;}
.brand-logo[hidden] {display:none;}
.brand {font-family: Arial, Helvetica, sans-serif; font-size:35px; line-height:1; font-weight:900; letter-spacing:-2.2px; max-width:540px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.brand-right { display:flex; align-items:center; gap:11px; letter-spacing:2px; font-weight:700; font-size:13px; }
.live-dot { width:9px; height:9px; border-radius:50%; background:var(--accent); }
.hero-copy { position:absolute; top:135px; left:58px; right:58px; height:330px; display:flex; flex-direction:column; align-items:flex-start; }
.eyebrow { display:flex; align-items:center; gap:15px; font-size:16px; font-weight:800; letter-spacing:2.2px; margin-bottom:18px; }
.eyebrow-line { width:49px; height:3px; background:var(--accent); }
.headline { font-size:87px; line-height:.92; margin:0; font-weight:900; letter-spacing:-5.2px; text-transform:uppercase; white-space:normal; width:100%; }
.headline em { color:var(--accent); font-style:normal; }
.intro-row { display:flex; justify-content:space-between; align-items:center; margin-top:24px; width:100%; gap:22px; }
.description { font-size:23px; line-height:1.35; margin:0; max-width:710px; font-weight:500; }
.question-sticker { font-size:68px; width:96px; height:96px; border:3px solid var(--ink); border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:900; transform:rotate(12deg); flex-shrink:0; }
.visual-zone { position:absolute; top:497px; left:58px; right:58px; height:458px; }
.stage-shadow { position:absolute; top:20px; left:20px; right:-10px; bottom:-6px; background:var(--accent); border:2px solid var(--ink); border-radius:17px; }
.product-photo { position:absolute; inset:0 19px 12px 0; border:3px solid var(--ink); border-radius:14px; overflow:hidden; margin:0; background:var(--photo-bg); }
.product-photo img { display:block; width:100%; height:100%; object-fit:cover; object-position:center 55%; }
.image-guard { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:var(--photo-bg); font-size:28px; font-weight:800; letter-spacing:1px; }
.image-guard[hidden] { display:none; }
.photo-caption { position:absolute; bottom:21px; left:22px; display:flex; align-items:center; gap:14px; font-size:17px; font-weight:800; letter-spacing:1.1px; background:var(--paper); border:2px solid var(--ink); border-radius:7px; padding:9px 15px 9px 9px; box-shadow:5px 5px 0 var(--ink); max-width:83%; }
.caption-icon { background:var(--ink); border-radius:5px; color:var(--paper); width:34px; height:34px; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:400; flex-shrink:0; }
.side-stamp { position:absolute; right:-23px; top:-29px; width:130px; height:130px; border-radius:50%; background:var(--ink); color:var(--paper); border:6px solid var(--paper); display:flex; flex-direction:column; align-items:center; justify-content:center; transform:rotate(13deg); z-index:3; font-weight:900; }
.side-stamp span:first-child { font-size:13px; letter-spacing:2px; }
.side-stamp span:last-child { font-size:65px; letter-spacing:-5px; line-height:1; }
.features { position:absolute; right:35px; top:25px; display:flex; flex-direction:column; align-items:flex-end; gap:10px; }
.features:not([hidden]) span { color:var(--paper); background:var(--ink); padding:8px 14px; font-size:18px; font-weight:700; border-radius:20px; }
.ad-footer { position:absolute; left:58px; right:58px; bottom:41px; height:76px; display:flex; align-items:center; justify-content:space-between; gap:18px; }
.footer-text { font-size:16px; font-weight:800; letter-spacing:1.4px; max-width:350px; }
.cta { min-width:315px; background:var(--ink); color:var(--paper); height:76px; border-radius:10px; display:flex; align-items:center; justify-content:space-between; gap:28px; font-size:21px; font-weight:900; letter-spacing:.4px; padding:12px 14px 12px 29px; }
.cta-arrow { width:49px; height:49px; border-radius:8px; background:var(--accent); color:var(--ink); display:flex; align-items:center; justify-content:center; font-size:35px; line-height:1; font-weight:400; flex-shrink:0; }
/* 4:5 portrait: preserve the concept while giving the product more space */
.creative--portrait { height:1350px; }
.creative--portrait .masthead { height:105px; }
.creative--portrait .hero-copy { top:169px; height:390px; }
.creative--portrait .headline { font-size:102px; }
.creative--portrait .description { font-size:26px; }
.creative--portrait .visual-zone { top:614px; height:584px; }
.creative--portrait .ad-footer { bottom:55px; height:84px; }
.creative--portrait .cta { height:82px; min-width:354px; font-size:23px; }
.creative--portrait .question-sticker { width:114px; height:114px; font-size:84px; }
/* 9:16 vertical: composition is deliberately re-art-directed rather than stretched */
.creative--story { height:1920px; }
.creative--story .masthead { top:100px; height:116px; left:66px; right:66px; }
.creative--story .brand { font-size:42px; }
.creative--story .brand-right { font-size:16px; }
.creative--story .hero-copy { top:305px; left:66px; right:66px; height:565px; }
.creative--story .eyebrow { font-size:22px; margin-bottom:26px; }
.creative--story .headline { font-size:120px; line-height: .95; letter-spacing:-6.5px; }
.creative--story .intro-row { margin-top:44px; }
.creative--story .description { font-size:34px; max-width:690px; }
.creative--story .question-sticker { width:135px; height:135px; font-size:94px; }
.creative--story .visual-zone { top:958px; left:66px; right:66px; height:669px; }
.creative--story .side-stamp { width:155px; height:155px; }
.creative--story .side-stamp span:last-child { font-size:61px; }
.creative--story .photo-caption { font-size:22px; padding:14px; }
.creative--story .ad-footer { left:66px; right:66px; bottom:168px; height:116px; }
.creative--story .footer-text { font-size:19px; max-width:270px; }
.creative--story .cta { height:110px; min-width:470px; border-radius:13px; font-size:28px; padding-left:35px; }
.creative--story .cta-arrow { height:77px; width:77px; border-radius:11px; font-size:51px; }
</style>
</head>

(() => {
  const defaults = {
    format: 'square',
    brand: 'LAYERFIT', brandRight: 'PRODUCT IN BEELD', logoUrl: '',
    eyebrow: 'EVEN EEN VRAAGJE',
    headline: 'OP ZOEK NAAR\n[[IETS DAT PAST?]]',
    description: 'Maak kennis met Product A. Bekijk het product en ontdek de details.',
    photoCaption: 'MAAK KENNIS MET PRODUCT A',
    cta: 'BEKIJK PRODUCT',
    footerNote: 'ONTDEK MEER OVER HET PRODUCT',
    imageUrl: window.T06_DEFAULT_IMAGE || './assets/demo-product.png',
    imageAlt: 'Demo product photograph',
    features: [],
    colors: {paper:'#f5f0e7',ink:'#1c3129',accent:'#ef6744',photoBg:'#e9e7df'}
  };
  const el = id => document.getElementById(id);
  function setText(id, value) { el(id).textContent = String(value ?? ''); }
  function setHeadline(value) {
    const heading = el('headline'); heading.replaceChildren();
    for (const part of String(value ?? '').split(/(\[\[[\s\S]*?\]\]|\n)/g)) {
      if (!part) continue;
      if (part === '\n') heading.append(document.createElement('br'));
      else if (part.startsWith('[[') && part.endsWith(']]')) {
        const accent = document.createElement('em'); accent.textContent=part.slice(2,-2); heading.append(accent);
      } else heading.append(document.createTextNode(part));
    }
  }
  function fitCopy() {
    const container = el('creative');
    const heading=el('headline');
    const limits={square:87,portrait:102,story:120};
    const mode=container.className.match(/creative--(\w+)/)?.[1] || 'square';
    const max=limits[mode], min=mode==='story'?70:54;
    for (let px=max; px>=min;px-=2) {
      heading.style.fontSize=px+'px';
      if (heading.scrollWidth <= heading.clientWidth + 1 && document.querySelector('.hero-copy').scrollHeight <= document.querySelector('.hero-copy').clientHeight + 1) return;
    }
    heading.style.fontSize=min+'px';
  }
  window.setCreative = async (input={}) => {
    const config={...defaults,...input, colors:{...defaults.colors,...(input.colors||{})}};
    const format=['square','portrait','story'].includes(config.format)?config.format:'square';
    el('creative').className='creative creative--'+format;
    for(const key of ['paper','ink','accent','photoBg']) {
      const cssVar={photoBg:'photo-bg'}[key] || key;
      document.documentElement.style.setProperty('--'+cssVar, config.colors[key]);
    }
    for(const [key,id] of Object.entries({brand:'brand',brandRight:'brand-right',eyebrow:'eyebrow',description:'description',photoCaption:'photo-caption',cta:'cta',footerNote:'footer-note'}))setText(id,config[key]);
    setHeadline(config.headline);
    const logo=el('brand-logo');
    logo.hidden=!config.logoUrl;
    el('brand').hidden=!!config.logoUrl;
    if (config.logoUrl) { logo.src=String(config.logoUrl); logo.alt=`${config.brand} logo`; logo.onerror=()=>{logo.hidden=true;el('brand').hidden=false;}; }
    const featureBox=el('features');featureBox.replaceChildren();
    const features=Array.isArray(config.features)?config.features.filter(x=>String(x).trim()).slice(0,2):[];
    featureBox.hidden=features.length===0;
    for(const f of features){const pill=document.createElement('span');pill.textContent=String(f);featureBox.append(pill);}
    const img=el('product-image');
    el('image-guard').hidden=true; img.hidden=false; img.alt=config.imageAlt;
    img.src=config.imageUrl || '';
    await new Promise((resolve)=>{ if(!img.src){img.hidden=true;el('image-guard').hidden=false;return resolve();} if(img.complete){if(!img.naturalWidth){img.hidden=true;el('image-guard').hidden=false;}return resolve();} img.onload=resolve; img.onerror=()=>{img.hidden=true;el('image-guard').hidden=false;resolve();}; });
    await document.fonts.ready;
    fitCopy();
    window.__T06_READY__=true;
    return config;
  };
  const query=new URLSearchParams(window.location.search);
  window.setCreative({format:query.get('format')||'square'});
})();
