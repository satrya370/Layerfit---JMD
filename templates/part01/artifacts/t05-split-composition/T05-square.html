<style>*,*::before,*::after{box-sizing:border-box;animation:none!important;transition:none!important;caret-color:transparent!important}
html,body{margin:0;padding:0;width:1080px;height:1080px;overflow:hidden;background:#ffffff}
[data-canvas]{position:relative;display:block;width:1080px;height:1080px;overflow:hidden;
--lf-canvas-w:1080px;--lf-canvas-h:1080px;--lf-safe-top:60px;--lf-safe-right:70px;--lf-safe-bottom:60px;--lf-safe-left:70px;
--lf-brand-primary:#173028;--lf-brand-secondary:#e9e8e0;--lf-brand-accent:#d5f86a;
--lf-font-heading:"LF Arimo", sans-serif;--lf-font-body:"LF Arimo", sans-serif}</style>
<style>/* ============================================================
   T05 SPLIT COMPOSITION — derived from Template-example/layerfit_t05/styles.css
   Same look: dark panel with big headline and lime accent, light panel with an arch outline,
   tilted photo card, round sticker and floating pill. Differences, on purpose:
   - colors, fonts and safe area come from engine tokens (--lf-*), not hard-coded
   - the two panels are real elements that bleed to the canvas edge with negative margins,
     while all content sits inside the safe box
   - the photo card follows the height that is left, and is never cut: cover only when allowed
   - scaffold text is not carried over ("05/15", "T / 05", "01 / 01", the slogan); the sticker is an icon
   ============================================================ */

.lf-split-composition {
  --ink: #182820;               /* dark text on the light panel and on the accent: schema checks contrast */
  --light: #f5f5eb;             /* light text on the dark panel: schema checks contrast against brand.primary */
  --soft: #e0e7df;
  --split: 0.48;
  --card: 420px;

  display: grid;
  grid-template-columns: calc(var(--lf-canvas-w) * var(--split) - var(--lf-safe-left)) minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr);
  padding: var(--lf-safe-top) var(--lf-safe-right) var(--lf-safe-bottom) var(--lf-safe-left);
  background: var(--lf-brand-secondary);
  color: var(--light);
  font-family: var(--lf-font-body);
}
.lf-split-composition * { margin: 0; box-sizing: border-box; }
/* Words are never broken mid-word to make text "fit": the fit groups shrink a too-wide word, and the render fails with a
   layout error if it still does not fit. */
.lf-split-composition .spl-svg { display: block; width: 100%; height: 100%; }

/* ---- panels: full-bleed backgrounds, content inside the safe box ---- */
.lf-split-composition .spl-left {
  display: flex; flex-direction: column; min-width: 0;
  margin: calc(-1 * var(--lf-safe-top)) 0 calc(-1 * var(--lf-safe-bottom)) calc(-1 * var(--lf-safe-left));
  padding: var(--lf-safe-top) 38px var(--lf-safe-bottom) var(--lf-safe-left);
  background: var(--lf-brand-primary);
}
.lf-split-composition .spl-right {
  display: flex; flex-direction: column; min-width: 0;
  margin: calc(-1 * var(--lf-safe-top)) calc(-1 * var(--lf-safe-right)) calc(-1 * var(--lf-safe-bottom)) 0;
  padding: var(--lf-safe-top) var(--lf-safe-right) var(--lf-safe-bottom) 32px;
  background: var(--lf-brand-secondary);
  color: var(--ink);
}

/* ---- left: brand, copy, CTA ---- */
.lf-split-composition .spl-masthead { display: flex; align-items: center; gap: 11px; }
.lf-split-composition .spl-brand { font-family: var(--lf-font-heading); font-weight: 900; font-size: 27px; letter-spacing: -0.025em; line-height: 1.1; }
.lf-split-composition .spl-logo { display: block; width: auto; max-width: 100%; max-height: 40px; object-fit: contain; }
.lf-split-composition .spl-star { flex: none; width: 30px; height: 30px; color: var(--lf-brand-accent); }
.lf-split-composition .spl-copy { margin: auto 0; padding: 30px 0 25px; min-width: 0; }
.lf-split-composition .spl-overline {
  display: flex; align-items: center; gap: 12px; margin-bottom: 28px;
  font-size: calc(13px * var(--lf-fit-offer, 1)); font-weight: 800; letter-spacing: 0.12em; line-height: 1.3; text-transform: uppercase; color: var(--lf-brand-accent);
}
.lf-split-composition .spl-dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--lf-brand-accent); }
.lf-split-composition .spl-headline {
  margin-bottom: 27px;
  font-family: var(--lf-font-heading); font-weight: 900;
  font-size: calc(64px * var(--lf-fit-headline, 1)); line-height: 1.04; letter-spacing: -0.025em; word-spacing: 0.04em; text-transform: uppercase;
}
.lf-split-composition .spl-accent { display: block; color: var(--lf-brand-accent); }
.lf-split-composition .spl-description { max-width: 402px; margin-bottom: 22px; font-size: calc(21px * var(--lf-fit-description, 1)); line-height: 1.38; color: var(--soft); }
.lf-split-composition .spl-benefits { display: flex; flex-wrap: wrap; gap: 10px; max-width: 400px; }
.lf-split-composition .spl-benefit {
  padding: 9px 13px; border: 1px solid #b6cabd57; border-radius: 4px;
  font-size: calc(12px * var(--lf-fit-benefits, 1)); font-weight: 700; letter-spacing: 0.09em; line-height: 1.3; text-transform: uppercase; color: #dbe6dd;
}
.lf-split-composition .spl-foot { display: flex; flex-direction: column; align-items: flex-start; }
.lf-split-composition .spl-cta {
  display: flex; align-items: center; justify-content: space-between; gap: 30px; max-width: 100%;
  min-width: 286px; min-height: 63px; padding: 10px 12px 10px 26px; border-radius: 999px;
  background: var(--lf-brand-accent); color: var(--ink);
  font-size: calc(16px * var(--lf-fit-cta, 1)); font-weight: 900; letter-spacing: 0.025em; line-height: 1.2; text-transform: uppercase;
}
.lf-split-composition .spl-cta-icon { flex: none; width: 43px; height: 43px; padding: 10px; border-radius: 50%; background: var(--ink); color: var(--light); }

/* ---- right: label row, stage, brand line ---- */
.lf-split-composition .spl-visual-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 4px 27px; }
.lf-split-composition .spl-proof { max-width: 340px; font-size: calc(12px * var(--lf-fit-proof, 1)); font-weight: 800; letter-spacing: 0.13em; line-height: 1.35; text-transform: uppercase; }
.lf-split-composition .spl-dots { display: flex; gap: 7px; margin-left: auto; }
.lf-split-composition .spl-dots i { display: block; width: 8px; height: 8px; border-radius: 50%; background: var(--ink); }
.lf-split-composition .spl-dots i:nth-child(2) { opacity: 0.4; }
.lf-split-composition .spl-dots i:nth-child(3) { opacity: 0.2; }
.lf-split-composition .spl-stage { position: relative; flex: 1 1 0; min-height: 0; display: flex; align-items: center; justify-content: center; }
.lf-split-composition .spl-arch { position: absolute; inset: 12px 7px 14px; border: 2px solid #bfc7bd; border-radius: 260px 260px 18px 18px; pointer-events: none; }
.lf-split-composition .spl-card {
  position: relative; z-index: 1; flex: none;
  height: min(100%, var(--card)); width: auto; aspect-ratio: 1 / 1;
  border: 8px solid #f9f9f4; border-radius: 9px; background: #d6d8d1; overflow: hidden;
  transform: rotate(-2.5deg); box-shadow: 0 30px 60px #29332637;
}
.lf-split-composition .spl-img { display: block; width: 100%; height: 100%; object-fit: contain; }
.lf-split-composition .spl-badge {
  position: absolute; z-index: 2; left: 4%; top: 5%; width: 72px; height: 72px; padding: 20px; border-radius: 50%;
  background: var(--lf-brand-accent); color: var(--ink); transform: rotate(-12deg);
}
.lf-split-composition .spl-pill {
  position: absolute; z-index: 3; right: 8px; bottom: 7%; display: flex; align-items: center; gap: 12px; max-width: 80%;
  padding: 15px 21px 15px 15px; border-radius: 999px; background: var(--lf-brand-primary); color: var(--light); transform: rotate(5deg);
  font-size: calc(12px * var(--lf-fit-pill, 1)); font-weight: 900; letter-spacing: 0.09em; line-height: 1.25; text-transform: uppercase; box-shadow: 0 14px 26px #00000025;
}
.lf-split-composition .spl-pill-star { flex: none; width: 23px; height: 23px; color: var(--lf-brand-accent); }
.lf-split-composition .spl-visual-bottom { display: flex; justify-content: space-between; padding-top: 33px; font-size: 11px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }

/* ---- portrait ---- */
.lf-split-composition[data-format="portrait"] { --split: 0.51; --card: 392px; }
.lf-split-composition[data-format="portrait"] .spl-headline { font-size: calc(76px * var(--lf-fit-headline, 1)); }
.lf-split-composition[data-format="portrait"] .spl-description { font-size: calc(24px * var(--lf-fit-description, 1)); }
.lf-split-composition[data-format="portrait"] .spl-pill { bottom: 9%; }

/* ---- vertical (story): panels stacked; content stays between the 250 px top and 350 px bottom insets ---- */
.lf-split-composition[data-format="vertical"] { --card: 500px; display: flex; flex-direction: column; }
.lf-split-composition[data-format="vertical"] .spl-left {
  flex: none;
  margin: calc(-1 * var(--lf-safe-top)) calc(-1 * var(--lf-safe-right)) 0 calc(-1 * var(--lf-safe-left));
  padding: var(--lf-safe-top) var(--lf-safe-right) 52px var(--lf-safe-left);
}
.lf-split-composition[data-format="vertical"] .spl-right {
  flex: 1 1 0; min-height: 0;
  margin: 0 calc(-1 * var(--lf-safe-right)) calc(-1 * var(--lf-safe-bottom)) calc(-1 * var(--lf-safe-left));
  padding: 48px var(--lf-safe-right) var(--lf-safe-bottom) var(--lf-safe-left);
}
.lf-split-composition[data-format="vertical"] .spl-copy { padding: 40px 0 34px; margin: 0; }
.lf-split-composition[data-format="vertical"] .spl-overline { margin-bottom: 26px; font-size: calc(15px * var(--lf-fit-offer, 1)); }
.lf-split-composition[data-format="vertical"] .spl-headline { max-width: 850px; margin-bottom: 26px; font-size: calc(92px * var(--lf-fit-headline, 1)); }
.lf-split-composition[data-format="vertical"] .spl-description { max-width: 780px; margin-bottom: 18px; font-size: calc(27px * var(--lf-fit-description, 1)); }
.lf-split-composition[data-format="vertical"] .spl-benefits { max-width: 860px; }
.lf-split-composition[data-format="vertical"] .spl-benefit { font-size: calc(14px * var(--lf-fit-benefits, 1)); }
.lf-split-composition[data-format="vertical"] .spl-visual-top { padding-bottom: 14px; }
/* The photo never shrinks below a readable size: copy above gives way first (headline fit group), then the render fails. */
.lf-split-composition[data-format="vertical"] .spl-stage { min-height: 440px; }
/* Proportional radii: the photo panel's height varies with the copy above it, so a fixed radius would flatten the arch. */
.lf-split-composition[data-format="vertical"] .spl-arch { border-radius: 50% 50% 18px 18px / 45% 45% 18px 18px; inset: 8px 60px 8px; }
.lf-split-composition[data-format="vertical"] .spl-badge { left: 10%; top: 4%; }
.lf-split-composition[data-format="vertical"] .spl-pill { right: 6%; bottom: 8%; font-size: calc(14px * var(--lf-fit-pill, 1)); }
.lf-split-composition[data-format="vertical"] .spl-visual-bottom { padding-top: 14px; }

/* ---- the photo may be cropped only when the asset allows it (the template sets data-allow-crop) ---- */
.lf-split-composition .spl-img[data-image-fit="cover"] { object-fit: cover; }

:root{--lf-css-ready:1}</style>
