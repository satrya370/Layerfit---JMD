<style>*,*::before,*::after{box-sizing:border-box;animation:none!important;transition:none!important;caret-color:transparent!important}
html,body{margin:0;padding:0;width:1080px;height:1080px;overflow:hidden;background:#ffffff}
[data-canvas]{position:relative;display:block;width:1080px;height:1080px;overflow:hidden;
--lf-canvas-w:1080px;--lf-canvas-h:1080px;--lf-safe-top:60px;--lf-safe-right:70px;--lf-safe-bottom:60px;--lf-safe-left:70px;
--lf-brand-primary:#3a2229;--lf-brand-secondary:#f8f0e3;--lf-brand-accent:#e26c47;
--lf-font-heading:"LF Montserrat", sans-serif;--lf-font-body:"LF Inter", sans-serif}</style>
<style>/* T19 After Dark Editorial. Canonical slots only; no source-specific event field extensions. */
.lf-after-dark-editorial {
  position:relative; width:100%; height:100%; overflow:hidden;
  background:var(--lf-brand-secondary); color:var(--lf-brand-primary); font-family:var(--lf-font-body);
}
.lf-after-dark-editorial * { box-sizing:border-box; margin:0; padding:0; }
.lf-after-dark-editorial .t19-layout { position:absolute; inset:0; overflow:hidden; }
.lf-after-dark-editorial .t19-meander { position:absolute; z-index:2; left:0; right:0; top:0; height:18px; background:repeating-linear-gradient(90deg,var(--lf-brand-accent) 0 10px,transparent 10px 18px,var(--lf-brand-accent) 18px 25px,transparent 25px 37px); }
.lf-after-dark-editorial .t19-brand {
  position:absolute; z-index:3; top:var(--lf-safe-top); left:var(--lf-safe-left); max-width:48%;
  font-size:20px; line-height:1.2; font-weight:800; letter-spacing:.1em;
}
.lf-after-dark-editorial .t19-logo { display:block; max-width:250px; max-height:56px; object-fit:contain; object-position:left center; }
.lf-after-dark-editorial .t19-eyebrow {
  position:absolute; z-index:3; top:var(--lf-safe-top); right:var(--lf-safe-right); max-width:48%;
  color:var(--lf-brand-accent); text-align:right; font-size:15px; line-height:1.3; font-weight:700; letter-spacing:.11em;
}
.lf-after-dark-editorial .t19-headline {
  position:absolute; z-index:2; left:var(--lf-safe-left); right:var(--lf-safe-right); top:16%;
  color:var(--lf-brand-primary); font-family:var(--lf-font-heading); font-size:calc(82px * var(--lf-fit-t19-headline,1));
  line-height:.94; font-weight:900; letter-spacing:-.035em; text-align:center; text-wrap:balance;
}
.lf-after-dark-editorial .t19-accent { color:var(--lf-brand-accent); font-family:var(--lf-font-body); font-style:italic; font-weight:700; letter-spacing:-.025em; }
.lf-after-dark-editorial .t19-photo-stage {
  position:absolute; z-index:1;
}
.lf-after-dark-editorial .t19-photo {
  position:relative; width:100%; height:100%; overflow:hidden; border-radius:10px; background:var(--lf-brand-primary);
}
.lf-after-dark-editorial .t19-photo img { display:block; width:100%; height:100%; object-fit:cover; object-position:50% 44%; }
.lf-after-dark-editorial .t19-photo img[data-image-fit="contain"] { object-fit:contain; }
.lf-after-dark-editorial .t19-photo::after { content:""; pointer-events:none; position:absolute; inset:55% 0 0; background:linear-gradient(transparent,rgba(25,10,11,.34)); }
.lf-after-dark-editorial .t19-product-name {
  position:absolute; z-index:2; left:24px; right:24px; bottom:18px; color:#fff8e8;
  font-size:14px; line-height:1.2; font-weight:800; letter-spacing:.12em; text-align:left;
}
.lf-after-dark-editorial .t19-offer {
  position:absolute; z-index:4; display:grid; place-items:center; text-align:center;
  width:172px; aspect-ratio:1; top:4%; right:4%; transform:rotate(10deg);
  border:3px solid var(--lf-brand-primary); border-radius:50%; background:var(--lf-brand-accent); color:var(--lf-brand-secondary);
  box-shadow:5px 6px 0 var(--lf-brand-primary); padding:18px;
  font-family:var(--lf-font-heading); font-size:calc(19px * var(--lf-fit-t19-offer,1)); font-weight:900; line-height:1.08; text-transform:uppercase;
}
.lf-after-dark-editorial .t19-description {
  position:absolute; z-index:3; display:flex; align-items:center; justify-content:center;
  background:var(--lf-brand-primary); color:var(--lf-brand-secondary); text-align:center;
  font-size:calc(22px * var(--lf-fit-t19-body,1)); line-height:1.4; font-weight:500;
}
.lf-after-dark-editorial .t19-cta-bar {
  position:absolute; z-index:6; left:var(--lf-safe-left); right:var(--lf-safe-right); bottom:var(--lf-safe-bottom);
  min-height:72px; display:flex; align-items:center; justify-content:center; gap:24px;
  padding:12px 28px; background:var(--lf-brand-primary); color:var(--lf-brand-secondary);
}
.lf-after-dark-editorial .t19-cta { font-size:calc(22px * var(--lf-fit-t19-cta,1)); line-height:1.25; font-weight:800; letter-spacing:.12em; text-align:center; }
.lf-after-dark-editorial .t19-arrow { width:28px; flex:0 0 auto; }
.lf-after-dark-editorial .t19-arrow path { fill:none; stroke:currentColor; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }

/* Square: strong typographic opener, arch-like landscape and compact detail/CTA footer. */
.lf-after-dark-editorial[data-format="square"] .t19-headline { top:15%; font-size:calc(78px * var(--lf-fit-t19-headline,1)); }
.lf-after-dark-editorial[data-format="square"] .t19-photo-stage { left:var(--lf-safe-left); right:var(--lf-safe-right); top:39%; height:35%; }
.lf-after-dark-editorial[data-format="square"] .t19-product-name { font-size:13px; }
.lf-after-dark-editorial[data-format="square"] .t19-offer { width:150px; }
.lf-after-dark-editorial[data-format="square"] .t19-description { left:var(--lf-safe-left); right:var(--lf-safe-right); top:77%; min-height:70px; padding:12px 20px; font-size:calc(18px * var(--lf-fit-t19-body,1)); }

/* Portrait: aligned header, centered headline/photo, then one dark description panel. */
.lf-after-dark-editorial[data-format="portrait"] .t19-headline { top:14%; font-size:calc(84px * var(--lf-fit-t19-headline,1)); }
.lf-after-dark-editorial[data-format="portrait"] .t19-photo-stage { left:var(--lf-safe-left); right:var(--lf-safe-right); top:36%; height:37%; }
.lf-after-dark-editorial[data-format="portrait"] .t19-offer { width:170px; }
.lf-after-dark-editorial[data-format="portrait"] .t19-description { left:var(--lf-safe-left); right:var(--lf-safe-right); top:75%; min-height:105px; padding:16px 28px; font-size:calc(21px * var(--lf-fit-t19-body,1)); }

/* Vertical: tighter editorial stack, with event/body copy and CTA sharing the lower content band. */
.lf-after-dark-editorial[data-format="vertical"] .t19-brand,
.lf-after-dark-editorial[data-format="vertical"] .t19-eyebrow { top:calc(var(--lf-safe-top) + 10px); }
.lf-after-dark-editorial[data-format="vertical"] .t19-headline { top:20%; font-size:calc(88px * var(--lf-fit-t19-headline,1)); line-height:.98; }
.lf-after-dark-editorial[data-format="vertical"] .t19-photo-stage { left:var(--lf-safe-left); right:var(--lf-safe-right); top:43%; height:27%; }
.lf-after-dark-editorial[data-format="vertical"] .t19-product-name { bottom:14px; font-size:17px; }
.lf-after-dark-editorial[data-format="vertical"] .t19-offer { width:180px; font-size:calc(18px * var(--lf-fit-t19-offer,1)); }
.lf-after-dark-editorial[data-format="vertical"] .t19-description { left:var(--lf-safe-left); right:var(--lf-safe-right); top:72%; min-height:122px; padding:18px 30px; font-size:calc(23px * var(--lf-fit-t19-body,1)); }
.lf-after-dark-editorial[data-format="vertical"] .t19-cta-bar { min-height:78px; }
.lf-after-dark-editorial[data-format="vertical"] .t19-cta { font-size:calc(24px * var(--lf-fit-t19-cta,1)); }

:root{--lf-css-ready:1}</style>
