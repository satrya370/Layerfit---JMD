<style>*,*::before,*::after{box-sizing:border-box;animation:none!important;transition:none!important;caret-color:transparent!important}
html,body{margin:0;padding:0;width:1080px;height:1350px;overflow:hidden;background:#ffffff}
[data-canvas]{position:relative;display:block;width:1080px;height:1350px;overflow:hidden;
--lf-canvas-w:1080px;--lf-canvas-h:1350px;--lf-safe-top:70px;--lf-safe-right:70px;--lf-safe-bottom:70px;--lf-safe-left:70px;
--lf-brand-primary:#eca16f;--lf-brand-secondary:#0e0e0e;--lf-brand-accent:#eea47b;
--lf-font-heading:"LF Fraunces", serif;--lf-font-body:"LF Arimo", sans-serif}</style>
<style>/* T12 — immersive hero image + editorial copy panel, ported from Template-example/LayerFit_T12/styles.css.
 * Geometry preserved: ~66/61/57% hero scene, centered dark eyebrow badge, peach copy panel.
 * Deliberate deviations: colors/fonts/safe area come from engine tokens; panel bottom padding uses
 * var(--lf-safe-bottom) instead of the source's 24-52px so text never enters the Meta UI zone;
 * horizontal panel padding uses the safe tokens (source used 60-76px).
 * "story" is mapped to the engine format name "vertical".
 */
.lf-immersive-editorial {
  position: relative; width: 100%; height: 100%; overflow: hidden;
  background: #efeeef; color: #1b1b1b; font-family: var(--lf-font-body);
}
.lf-immersive-editorial * { margin: 0; padding: 0; box-sizing: border-box; }

.lf-immersive-editorial .t12-scene { position: relative; height: 66%; overflow: hidden; background: #9db7c8; }
.lf-immersive-editorial .t12-photo { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; }
.lf-immersive-editorial .t12-eyebrow {
  position: absolute; z-index: 2; top: 9%; left: 50%; transform: translateX(-50%);
  display: block; white-space: nowrap; text-align: center; max-width: calc(100% - 2 * var(--lf-safe-left));
  background: var(--lf-brand-secondary); color: var(--lf-brand-accent);
  padding: 7px 17px 6px; font-size: calc(23px * var(--lf-fit-eyebrow, 1)); line-height: 1.4; font-weight: 700; letter-spacing: 1.2px;
}
.lf-immersive-editorial .t12-panel {
  position: absolute; left: 0; right: 0; top: 66%; bottom: 0;
  background: var(--lf-brand-primary); text-align: center;
  padding: 24px var(--lf-safe-right) var(--lf-safe-bottom) var(--lf-safe-left);
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
}
.lf-immersive-editorial .t12-headline {
  font-family: var(--lf-font-heading); font-weight: 700;
  font-size: calc(76px * var(--lf-fit-headline, 1)); line-height: 0.97; letter-spacing: -3.7px;
  margin: 0 auto 16px; max-width: 930px;
}
.lf-immersive-editorial .t12-headline span { display: block; }
.lf-immersive-editorial .t12-description {
  font-size: calc(23px * var(--lf-fit-description, 1)); line-height: 1.18; letter-spacing: -0.1px;
  margin: 0 auto; max-width: 820px;
}
.lf-immersive-editorial .t12-cta {
  flex-shrink: 0; margin: 16px auto 0; padding: 10px 26px;
  background: var(--lf-brand-secondary); color: var(--lf-brand-accent);
  font-family: var(--lf-font-body); font-size: calc(20px * var(--lf-fit-cta, 1));
  font-weight: 700; line-height: 1.2; letter-spacing: 1px; max-width: 100%;
}

/* Portrait: same stacked hierarchy, larger editorial area. */
.lf-immersive-editorial[data-format="portrait"] .t12-scene { height: 61%; }
.lf-immersive-editorial[data-format="portrait"] .t12-panel { top: 61%; padding-top: 60px; }
.lf-immersive-editorial[data-format="portrait"] .t12-eyebrow { font-size: calc(23px * var(--lf-fit-eyebrow, 1)); }
.lf-immersive-editorial[data-format="portrait"] .t12-headline { font-size: calc(88px * var(--lf-fit-headline, 1)); line-height: 0.98; max-width: 950px; letter-spacing: -3.9px; margin-bottom: 24px; }
.lf-immersive-editorial[data-format="portrait"] .t12-description { font-size: calc(29px * var(--lf-fit-description, 1)); line-height: 1.25; max-width: 860px; }
.lf-immersive-editorial[data-format="portrait"] .t12-cta { margin-top: 20px; font-size: calc(24px * var(--lf-fit-cta, 1)); }

/* Vertical (story): dedicated layout, generous head/tail clearance inside the engine safe box. */
.lf-immersive-editorial[data-format="vertical"] .t12-scene { height: 57%; }
.lf-immersive-editorial[data-format="vertical"] .t12-panel { top: 57%; padding: 60px var(--lf-safe-right) var(--lf-safe-bottom) var(--lf-safe-left); }
/* 14% of the scene would put the badge above the 250px vertical safe top; keep the source's
 * canvas-relative position (14% of 1920 = 269px) via the engine token instead. */
.lf-immersive-editorial[data-format="vertical"] .t12-eyebrow { top: calc(var(--lf-safe-top) + 19px); font-size: calc(27px * var(--lf-fit-eyebrow, 1)); padding: 10px 20px; }
.lf-immersive-editorial[data-format="vertical"] .t12-headline { font-size: calc(100px * var(--lf-fit-headline, 1)); max-width: 990px; line-height: 1; letter-spacing: -4.1px; margin-bottom: 24px; }
.lf-immersive-editorial[data-format="vertical"] .t12-description { font-size: calc(30px * var(--lf-fit-description, 1)); line-height: 1.28; max-width: 900px; }
.lf-immersive-editorial[data-format="vertical"] .t12-cta { margin-top: 24px; padding: 12px 30px; font-size: calc(26px * var(--lf-fit-cta, 1)); }

/* The photo may be cropped only when the asset config allows it (the template sets data-allow-crop). */
.lf-immersive-editorial .t12-photo[data-image-fit="contain"] { object-fit: contain; }

:root{--lf-css-ready:1}</style>
