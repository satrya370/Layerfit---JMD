<style>*,*::before,*::after{box-sizing:border-box;animation:none!important;transition:none!important;caret-color:transparent!important}
html,body{margin:0;padding:0;width:1080px;height:1350px;overflow:hidden;background:#ffffff}
[data-canvas]{position:relative;display:block;width:1080px;height:1350px;overflow:hidden;
--lf-canvas-w:1080px;--lf-canvas-h:1350px;--lf-safe-top:70px;--lf-safe-right:70px;--lf-safe-bottom:70px;--lf-safe-left:70px;
--lf-brand-primary:#232b3a;--lf-brand-secondary:#f1ebdf;--lf-brand-accent:#b3541e;
--lf-font-heading:"LF Montserrat", sans-serif;--lf-font-body:"LF Inter", sans-serif}</style>
<style>/* T18 folder / T19 Fashion source: Mediterranean poster, arch photo and campaign badge. */
.lf-mediterranean-fashion-poster {
  position:relative; width:100%; height:100%; overflow:hidden;
  color:var(--lf-brand-primary); background:var(--lf-brand-secondary); font-family:var(--lf-font-body);
}
.lf-mediterranean-fashion-poster * { box-sizing:border-box; margin:0; padding:0; }
.lf-mediterranean-fashion-poster .t18-content { position:absolute; inset:0; overflow:hidden; }
.lf-mediterranean-fashion-poster .t18-grain {
  position:absolute; inset:0; z-index:8; pointer-events:none; opacity:.035;
  background-image:repeating-radial-gradient(circle at 15% 25%,rgba(0,0,0,.2) 0 .5px,transparent .7px 3px);
}
.lf-mediterranean-fashion-poster[data-texture="off"] .t18-grain { display:none; }
.lf-mediterranean-fashion-poster .t18-meander {
  position:absolute; left:0; right:0; height:24px; z-index:5;
  background:repeating-linear-gradient(90deg,var(--t18-mid) 0 12px,transparent 12px 20px,var(--t18-mid) 20px 27px,transparent 27px 39px);
  opacity:.72;
}
.lf-mediterranean-fashion-poster .t18-meander--foot { display:none; }
.lf-mediterranean-fashion-poster[data-format="vertical"] .t18-meander--foot { display:block; top:151.5cqw; }
.lf-mediterranean-fashion-poster .t18-stage {
  position:absolute; z-index:2; top:calc(var(--lf-safe-top) + 18px); left:var(--lf-safe-left); right:var(--lf-safe-right);
  bottom:calc(var(--lf-safe-bottom) + 100px); display:flex; flex-direction:column; align-items:center;
  justify-content:space-between; text-align:center;
}
.lf-mediterranean-fashion-poster .t18-head { width:100%; text-align:center; }
.lf-mediterranean-fashion-poster .t18-headline {
  font-family:var(--lf-font-heading); font-size:calc(82px * var(--lf-fit-t18-headline,1));
  line-height:.91; letter-spacing:.005em; font-weight:900; text-transform:uppercase;
}
.lf-mediterranean-fashion-poster .t18-headline-line { display:block; width:fit-content; max-width:100%; margin:0 auto; white-space:nowrap; }
.lf-mediterranean-fashion-poster .t18-headline-line:nth-child(1) { color:var(--lf-brand-primary); }
.lf-mediterranean-fashion-poster .t18-headline-line:nth-child(2) { color:var(--t18-mid); }
.lf-mediterranean-fashion-poster .t18-headline-line:nth-child(3) { color:var(--lf-brand-accent); }
.lf-mediterranean-fashion-poster .t18-script {
  display:flex; align-items:center; justify-content:center; gap:22px; margin-top:12px;
  color:var(--t18-gold); font-family:var(--lf-font-heading); font-size:calc(42px * var(--lf-fit-t18-script,1));
  font-style:italic; line-height:1.2; white-space:nowrap;
}
.lf-mediterranean-fashion-poster .t18-sprig { width:104px; flex:0 0 auto; overflow:visible; }
.lf-mediterranean-fashion-poster .t18-sprig path { fill:none; stroke:var(--t18-mid); stroke-width:2; stroke-linecap:round; }
.lf-mediterranean-fashion-poster .t18-sprig ellipse { fill:var(--t18-mid); }
.lf-mediterranean-fashion-poster .t18-sprig circle { fill:var(--lf-brand-accent); }
.lf-mediterranean-fashion-poster .t18-sprig--right { transform:scaleX(-1); }
.lf-mediterranean-fashion-poster .t18-hero {
  position:relative; width:56%; height:30cqw; flex:0 0 auto; margin:14px 0 8px;
}
.lf-mediterranean-fashion-poster .t18-arch-shadow,
.lf-mediterranean-fashion-poster .t18-arch-frame { width:100%; height:100%; border-radius:21cqw 21cqw 0 0; }
.lf-mediterranean-fashion-poster .t18-arch-shadow { position:absolute; inset:0; background:var(--lf-brand-accent); transform:translate(14px,14px); }
.lf-mediterranean-fashion-poster .t18-arch-frame { position:relative; overflow:hidden; background:var(--lf-brand-primary); }
.lf-mediterranean-fashion-poster .t18-image { position:absolute; left:11px; top:11px; display:block; width:calc(100% - 22px); height:calc(100% - 11px); object-fit:cover; object-position:50% 35%; background:var(--lf-brand-secondary); border-radius:calc(21cqw - 11px) calc(21cqw - 11px) 0 0; }
.lf-mediterranean-fashion-poster .t18-image[data-image-fit="contain"] { object-fit:contain; }
.lf-mediterranean-fashion-poster .t18-burst {
  position:absolute; top:-25px; right:-28px; width:224px; aspect-ratio:1; transform:rotate(-8deg); z-index:3;
  display:grid; place-items:center;
}
.lf-mediterranean-fashion-poster .t18-burst-star {
  position:absolute; inset:0; background:var(--lf-brand-accent);
  clip-path:polygon(50% 0%,60% 11%,75% 7%,78% 22%,93% 25%,89% 40%,100% 50%,89% 60%,93% 75%,78% 78%,75% 93%,60% 89%,50% 100%,40% 89%,25% 93%,22% 78%,7% 75%,11% 60%,0% 50%,11% 40%,7% 25%,22% 22%,25% 7%,40% 11%);
}
.lf-mediterranean-fashion-poster .t18-burst-ring { inset:7%; background:var(--lf-brand-secondary); }
.lf-mediterranean-fashion-poster .t18-burst-inner { inset:12%; }
.lf-mediterranean-fashion-poster .t18-burst-text {
  position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  color:var(--t18-on-accent); font-size:calc(21px * var(--lf-fit-t18-badge,1)); line-height:1.05;
  font-weight:700; letter-spacing:.09em; text-transform:uppercase; white-space:nowrap;
}
.lf-mediterranean-fashion-poster .t18-info { width:100%; text-align:center; }
.lf-mediterranean-fashion-poster .t18-address {
  width:fit-content; max-width:100%; margin:0 auto; color:var(--lf-brand-primary);
  font-family:var(--lf-font-heading); font-size:calc(36px * var(--lf-fit-t18-address,1));
  font-weight:900; line-height:1.12; letter-spacing:.12em; text-transform:uppercase; white-space:nowrap;
}
.lf-mediterranean-fashion-poster .t18-eventrow {
  display:flex; align-items:center; gap:30px; width:100%; margin-top:16px;
}
.lf-mediterranean-fashion-poster .t18-event-side {
  flex:1 1 0; min-width:0; color:var(--t18-mid); font-family:var(--lf-font-heading);
  font-size:calc(17px * var(--lf-fit-t18-event,1)); font-weight:700; line-height:1.25;
  letter-spacing:.1em; text-transform:uppercase; white-space:nowrap;
}
.lf-mediterranean-fashion-poster .t18-event-date { text-align:left; border-right:1px solid rgba(0,0,0,.24); }
.lf-mediterranean-fashion-poster .t18-event-time { text-align:right; border-left:1px solid rgba(0,0,0,.24); }
.lf-mediterranean-fashion-poster .t18-brand { flex:0 0 auto; color:var(--lf-brand-primary); font-family:var(--lf-font-heading); font-size:calc(92px * var(--lf-fit-t18-brand,1)); font-weight:900; line-height:1; letter-spacing:.025em; text-transform:uppercase; white-space:nowrap; }
.lf-mediterranean-fashion-poster .t18-cta {
  position:absolute; z-index:6; left:0; right:0; bottom:var(--lf-safe-bottom); min-height:74px;
  display:flex; align-items:center; justify-content:center; gap:26px; padding:10px var(--lf-safe-left);
  color:var(--t18-on-accent); background:var(--lf-brand-primary);
}
.lf-mediterranean-fashion-poster .t18-cta-label { font-size:calc(26px * var(--lf-fit-t18-cta,1)); line-height:1.2; font-weight:700; letter-spacing:.2em; text-transform:uppercase; white-space:nowrap; }
.lf-mediterranean-fashion-poster .t18-arrow { width:32px; height:auto; flex:0 0 auto; }
.lf-mediterranean-fashion-poster .t18-arrow path { fill:none; stroke:currentColor; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }

/* Tall posters use one center axis with fixed rhythm, not stretched space-between gaps. */
.lf-mediterranean-fashion-poster[data-format="portrait"] .t18-stage,
.lf-mediterranean-fashion-poster[data-format="vertical"] .t18-stage {
  top:calc(var(--lf-safe-top) + 12px); bottom:calc(var(--lf-safe-bottom) + 112px);
  justify-content:center; gap:30px;
}
.lf-mediterranean-fashion-poster[data-format="portrait"] .t18-headline,
.lf-mediterranean-fashion-poster[data-format="vertical"] .t18-headline { font-size:calc(86px * var(--lf-fit-t18-headline,1)); line-height:1.02; letter-spacing:0; }
.lf-mediterranean-fashion-poster[data-format="portrait"] .t18-script,
.lf-mediterranean-fashion-poster[data-format="vertical"] .t18-script { margin-top:14px; font-size:calc(40px * var(--lf-fit-t18-script,1)); gap:20px; line-height:1.25; }
.lf-mediterranean-fashion-poster[data-format="portrait"] .t18-sprig,
.lf-mediterranean-fashion-poster[data-format="vertical"] .t18-sprig { width:90px; }
.lf-mediterranean-fashion-poster[data-format="portrait"] .t18-hero,
.lf-mediterranean-fashion-poster[data-format="vertical"] .t18-hero { width:600px; height:430px; margin:8px 0 0; }
.lf-mediterranean-fashion-poster[data-format="portrait"] .t18-arch-shadow,
.lf-mediterranean-fashion-poster[data-format="portrait"] .t18-arch-frame,
.lf-mediterranean-fashion-poster[data-format="vertical"] .t18-arch-shadow,
.lf-mediterranean-fashion-poster[data-format="vertical"] .t18-arch-frame { height:100%; border-radius:280px 280px 0 0; }
.lf-mediterranean-fashion-poster[data-format="portrait"] .t18-image,
.lf-mediterranean-fashion-poster[data-format="vertical"] .t18-image { border-radius:269px 269px 0 0; }
.lf-mediterranean-fashion-poster[data-format="portrait"] .t18-burst,
.lf-mediterranean-fashion-poster[data-format="vertical"] .t18-burst { width:190px; top:-20px; right:-22px; }
.lf-mediterranean-fashion-poster[data-format="portrait"] .t18-burst-text,
.lf-mediterranean-fashion-poster[data-format="vertical"] .t18-burst-text { font-size:calc(19px * var(--lf-fit-t18-badge,1)); }
.lf-mediterranean-fashion-poster[data-format="portrait"] .t18-info,
.lf-mediterranean-fashion-poster[data-format="vertical"] .t18-info { width:800px; max-width:100%; }
.lf-mediterranean-fashion-poster[data-format="portrait"] .t18-address,
.lf-mediterranean-fashion-poster[data-format="vertical"] .t18-address { font-size:calc(32px * var(--lf-fit-t18-address,1)); line-height:1.2; letter-spacing:.06em; }
.lf-mediterranean-fashion-poster[data-format="portrait"] .t18-eventrow,
.lf-mediterranean-fashion-poster[data-format="vertical"] .t18-eventrow {
  display:grid; grid-template-columns:1fr 1fr; align-items:center; gap:14px 24px; margin-top:12px;
}
.lf-mediterranean-fashion-poster[data-format="portrait"] .t18-brand,
.lf-mediterranean-fashion-poster[data-format="vertical"] .t18-brand {
  grid-column:1 / 3; grid-row:1; font-size:calc(66px * var(--lf-fit-t18-brand,1)); line-height:1.08; letter-spacing:.015em;
}
.lf-mediterranean-fashion-poster[data-format="portrait"] .t18-event-side,
.lf-mediterranean-fashion-poster[data-format="vertical"] .t18-event-side {
  grid-row:2; border:0; border-top:1px solid rgba(0,0,0,.18); padding-top:12px;
  text-align:center; font-size:calc(22px * var(--lf-fit-t18-event,1)); line-height:1.35; letter-spacing:.04em;
}
.lf-mediterranean-fashion-poster[data-format="portrait"] .t18-cta,
.lf-mediterranean-fashion-poster[data-format="vertical"] .t18-cta { top:auto; bottom:var(--lf-safe-bottom); min-height:80px; }
.lf-mediterranean-fashion-poster[data-format="portrait"] .t18-cta-label,
.lf-mediterranean-fashion-poster[data-format="vertical"] .t18-cta-label { font-size:calc(26px * var(--lf-fit-t18-cta,1)); letter-spacing:.12em; }
.lf-mediterranean-fashion-poster[data-format="vertical"] .t18-stage { gap:32px; }
.lf-mediterranean-fashion-poster[data-format="vertical"] .t18-headline { font-size:calc(92px * var(--lf-fit-t18-headline,1)); }
.lf-mediterranean-fashion-poster[data-format="vertical"] .t18-hero { width:640px; height:500px; }
.lf-mediterranean-fashion-poster[data-format="vertical"] .t18-brand { font-size:calc(70px * var(--lf-fit-t18-brand,1)); }
