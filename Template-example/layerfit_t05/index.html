<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LayerFit — T05 Split Composition</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- This artboard is rendered to PNG/JPG by Puppeteer or Playwright. -->
  <main id="creative" class="creative creative--square" aria-label="T05 split composition advertisement">
    <div class="left-panel">
      <header class="masthead">
        <div class="brand-lockup">
          <span id="brand" class="brand-wordmark">LAYERFIT</span>
          <span class="brand-mark" aria-hidden="true">✳</span>
        </div>
        <div id="eyebrow" class="eyebrow">PRODUCT SPOTLIGHT · 05/15</div>
      </header>

      <div class="copy-area">
        <div class="divider-line"><span class="divider-dot"></span><span id="overline">ONTDEK DE COLLECTIE</span></div>
        <h1 id="headline" class="headline">MAAK KENNIS<br>MET <em>PRODUCT A.</em></h1>
        <p id="description" class="description">Bekijk het product, ontdek de details en vind wat bij jou past.</p>
        <div id="benefit-list" class="benefits"></div>
      </div>

      <footer class="left-footer">
        <div id="cta" class="cta"><span id="cta-text">BEKIJK PRODUCT</span><span class="cta-icon" aria-hidden="true">↗</span></div>
        <span class="footer-note" id="footer-note">JOUW PRODUCT. JOUW VERHAAL.</span>
      </footer>
    </div>

    <section class="visual-panel" aria-label="Product photograph">
      <div class="visual-top">
        <span class="visual-label" id="visual-label">GEMAAKT OM TE ONTDEKKEN</span>
        <span class="visual-dots" aria-hidden="true"><i></i><i></i><i></i></span>
      </div>
      <div class="product-stage">
        <div class="stage-outline" aria-hidden="true"></div>
        <div class="product-image-wrap">
          <img id="product-image" src="./assets/demo-product.png" alt="Demonstration product photograph" />
        </div>
        <span class="corner-code">T / 05</span>
        <div class="floating-pill"><span class="pill-spark" aria-hidden="true">✳</span><span id="floating-pill">BEKIJK DE DETAILS</span></div>
      </div>
      <div class="visual-bottom"><span id="brand-subline">LAYERFIT / CREATIVE STUDIO</span><span>→ 01 / 01</span></div>
    </section>
  </main>
  <script src="./script.js"></script>
</body>
</html>
