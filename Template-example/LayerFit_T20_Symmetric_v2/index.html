<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LayerFit T20 | Circular Product Benefits</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main id="creative" class="creative" data-format="square" aria-label="Static Meta ad creative">
    <div class="ambient" aria-hidden="true"></div>
    <div class="brand-zone">
      <div class="brand" id="brand">Waxli</div>
      <div class="product-type" id="topline">SOFT HAIR REMOVAL WAX</div>
    </div>

    <section class="hero" aria-label="Product highlights">
      <div class="hero-halo" aria-hidden="true"></div>
      <div class="orbit" aria-hidden="true"></div>
      <div class="product-shadow" aria-hidden="true"></div>
      <img class="product-image" id="productImage" src="assets/waxli-demo-cutout.png" alt="Product photograph">

      <div class="benefits" id="benefits" aria-label="Product benefits"></div>
    </section>
  </main>
</body>
</html>
