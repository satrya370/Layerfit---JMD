<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>T14 — Bold Outlined Product Poster</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="script.js" defer></script>
</head>
<body class="creative-page">
  <main id="creative" class="creative" data-format="story">
    <div class="announcement" id="announcement" hidden></div>
    <div class="top-outline" id="topOutline" aria-label="Product category">
      <span>HEIGHT</span><span>BOOSTING</span><span>SHOES</span>
    </div>
    <div class="scene" aria-hidden="true">
      <img id="productImage" src="assets/boot-scene.png" alt="" />
    </div>
    <div class="main-headline" id="mainHeadline">ADD 3 INCHES</div>
    <div class="bottom-outline" id="bottomOutline">
      <span>WHERE IT</span><span>MATTERS</span><span>MOST</span>
    </div>
    <div class="teaser" id="teaser">DOWN THERE <span class="hand">👇</span></div>
    <div class="brand-mark" id="brand">C O N Z U R I</div>
  </main>
</body>
</html>
