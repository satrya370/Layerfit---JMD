<!doctype html>
<html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>T16 — Discount + Gift Ad</title><link rel="stylesheet" href="styles.css"><script defer src="script.js"></script></head>
<body>
<main class="creative" id="creative" data-format="square" aria-label="Static discount meta ad">

  </div>
</main>
