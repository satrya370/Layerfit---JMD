<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LayerFit — T06 / Question Hook</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="creative creative--square" id="creative" aria-label="LayerFit T06 Question Hook advertising creative">
    <header class="masthead">
      <div class="brand-lockup"><img class="brand-logo" id="brand-logo" alt="Brand logo" hidden /><div class="brand" id="brand">LAYERFIT</div></div>
      <div class="brand-right"><span class="live-dot" aria-hidden="true"></span><span id="brand-right">PRODUCT IN BEELD</span></div>
    </header>
    <section class="hero-copy" aria-label="Advertising message">
      <div class="eyebrow"><span class="eyebrow-line"></span><span id="eyebrow">EVEN EEN VRAAGJE</span></div>
      <h1 class="headline" id="headline">OP ZOEK NAAR<br><em>IETS DAT PAST?</em></h1>
      <div class="intro-row">
        <p id="description" class="description">Maak kennis met Product A. Bekijk het product en ontdek de details.</p>
        <span class="question-sticker" aria-hidden="true">?</span>
      </div>
    </section>
    <section class="visual-zone" aria-label="Product illustration and features">
      <div class="stage-shadow" aria-hidden="true"></div>
      <figure class="product-photo">
        <img src="./assets/demo-product.png" alt="Demo product photo, replace with supplied product asset" id="product-image" />
        <div class="image-guard" id="image-guard" hidden>VOEG PRODUCTFOTO TOE</div>
        <figcaption class="photo-caption"><span class="caption-icon" aria-hidden="true">↗</span><span id="photo-caption">MAAK KENNIS MET PRODUCT A</span></figcaption>
      </figure>
      <div class="side-stamp" aria-hidden="true"><span>ONTDEK</span><span>?</span></div>
      <div class="features" id="features" hidden></div>
    </section>
    <footer class="ad-footer">
      <span class="footer-text" id="footer-note">ONTDEK MEER OVER HET PRODUCT</span>
      <div class="cta"><span id="cta">BEKIJK PRODUCT</span><span class="cta-arrow" aria-hidden="true">↗</span></div>
    </footer>
  </main>
  <script src="./script.js"></script>
</body>
</html>
