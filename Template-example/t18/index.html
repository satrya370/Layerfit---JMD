<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LayerFit T19 — Fashion</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="ad" id="ad" data-format="square" data-texture="on" data-ctabar="on" data-image-mode="cover">

  <!-- paper grain (print feel) -->
  <div class="grain" aria-hidden="true"></div>

  <!-- Greek key (meander) strip, top edge -->
  <div class="meander meander--top" aria-hidden="true"></div>

  <div class="stage">

    <!-- ============ headline block ============ -->
    <header class="head">
      <h1 class="headline" id="headline">
        <span class="headline__line headline__line--1" id="hl1">LINNEN,</span>
        <span class="headline__line headline__line--2" id="hl2">ZON &amp; LATE</span>
        <span class="headline__line headline__line--3" id="hl3">ZOMERS</span>
      </h1>
      <p class="script" id="scriptLine">
        <svg class="sprig sprig--l" viewBox="0 0 64 26" aria-hidden="true" focusable="false">
          <path class="sprig__stem" d="M2 20C20 8 42 6 62 14"></path>
          <g class="sprig__leaf">
            <ellipse cx="14" cy="14" rx="6.2" ry="2.3" transform="rotate(-24 14 14)"/>
            <ellipse cx="24" cy="10.5" rx="6.2" ry="2.3" transform="rotate(-17 24 10.5)"/>
            <ellipse cx="35" cy="8.6" rx="6.2" ry="2.3" transform="rotate(-9 35 8.6)"/>
            <ellipse cx="46" cy="8.6" rx="6.2" ry="2.3" transform="rotate(2 46 8.6)"/>
            <ellipse cx="56" cy="10.8" rx="5.6" ry="2.1" transform="rotate(9 56 10.8)"/>
            <ellipse cx="18" cy="17.5" rx="5.4" ry="2" transform="rotate(18 18 17.5)"/>
            <ellipse cx="30" cy="14" rx="5.4" ry="2" transform="rotate(24 30 14)"/>
            <ellipse cx="42" cy="12.4" rx="5.4" ry="2" transform="rotate(30 42 12.4)"/>
          </g>
          <g class="sprig__fruit">
            <circle cx="12" cy="8.5" r="2.6"/>
            <circle cx="38" cy="16.5" r="2.6"/>
          </g>
        </svg>
        <span class="script__text" id="scriptText">Winterzon Editie</span>
        <svg class="sprig sprig--r" viewBox="0 0 64 26" aria-hidden="true" focusable="false">
          <path class="sprig__stem" d="M2 20C20 8 42 6 62 14"></path>
          <g class="sprig__leaf">
            <ellipse cx="14" cy="14" rx="6.2" ry="2.3" transform="rotate(-24 14 14)"/>
            <ellipse cx="24" cy="10.5" rx="6.2" ry="2.3" transform="rotate(-17 24 10.5)"/>
            <ellipse cx="35" cy="8.6" rx="6.2" ry="2.3" transform="rotate(-9 35 8.6)"/>
            <ellipse cx="46" cy="8.6" rx="6.2" ry="2.3" transform="rotate(2 46 8.6)"/>
            <ellipse cx="56" cy="10.8" rx="5.6" ry="2.1" transform="rotate(9 56 10.8)"/>
            <ellipse cx="18" cy="17.5" rx="5.4" ry="2" transform="rotate(18 18 17.5)"/>
            <ellipse cx="30" cy="14" rx="5.4" ry="2" transform="rotate(24 30 14)"/>
            <ellipse cx="42" cy="12.4" rx="5.4" ry="2" transform="rotate(30 42 12.4)"/>
          </g>
          <g class="sprig__fruit">
            <circle cx="12" cy="8.5" r="2.6"/>
            <circle cx="38" cy="16.5" r="2.6"/>
          </g>
        </svg>
      </p>
    </header>

    <!-- ============ hero: arch-framed photo + starburst badge ============ -->
    <figure class="hero" id="hero">
      <div class="arch arch--shadow" aria-hidden="true"></div>
      <div class="arch arch--frame">
        <img class="arch__img" id="heroImg" src="assets/hero.jpg" alt="">
      </div>
      <div class="burst" id="burst">
        <div class="burst__star burst__star--outer" aria-hidden="true"></div>
        <div class="burst__star burst__star--ring" aria-hidden="true"></div>
        <div class="burst__star burst__star--inner" aria-hidden="true"></div>
        <div class="burst__text">
          <span id="burstL1">LIMITED</span>
          <span id="burstL2">EDITIE</span>
        </div>
      </div>
    </figure>

    <!-- ============ event info ============ -->
    <div class="info">
      <p class="address" id="address">VANAF € 24,95</p>
      <div class="eventrow" id="eventrow">
        <div class="eventrow__side eventrow__side--left" id="dateSide">
          <span class="eventrow__date" id="eventDate">T/M ZO 29 NOV.</span>
        </div>
        <div class="eventrow__brand">
          <span class="brand" id="brandName">ELIA</span>
        </div>
        <div class="eventrow__side eventrow__side--right" id="timeSide">
          <span class="eventrow__time" id="eventTime">-30% ONLINE</span>
        </div>
      </div>
    </div>

  </div>

  <!-- ============ CTA bar (ink footer strip) ============ -->
  <div class="ctabar" id="ctabar">
    <span class="ctabar__label" id="ctaLabel">SHOP DE COLLECTIE</span>
    <svg class="ctabar__arrow" viewBox="0 0 24 14" aria-hidden="true" focusable="false">
      <path d="M1 7H21M15 1.5 21.5 7 15 12.5" fill="none" stroke="currentColor"
            stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <!-- Greek key strip, bottom (story decor / fallback bila CTA kosong) -->
  <div class="meander meander--foot" aria-hidden="true"></div>

</main>

<script src="script.js"></script>
</body>
</html>
