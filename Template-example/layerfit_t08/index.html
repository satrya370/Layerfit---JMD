<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080" />
  <title>LayerFit — T08 Photo Overlay</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!--
    The artboard. script.js fills it from window.setCreative(data).
    Open this file in a browser and call window.setCreative({...}) in the console, or run `npm run render`.
    The root carries the same class as the engine module (lf-photo-overlay), so the same design CSS runs in both.
  -->
  <main id="creative" class="creative lf-photo-overlay" data-format="square" aria-label="T08 Photo Overlay advertisement"></main>
  <script src="./script.js"></script>
</body>
</html>
