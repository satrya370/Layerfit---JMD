<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>T10 — Atmospheric Editorial</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="script.js" defer></script>
</head>
<body>
<main class="creative" id="creative" data-format="square" aria-label="Static ad artwork">
  <p class="micro micro-left" id="topLeft">103 N 10TH ST</p>
  <p class="micro micro-right" id="topRight">YOUR ESCAPE STARTS HERE.</p>
  <figure class="photo"><img id="productImage" src="assets/demo-spa-photo.png" alt="Spa lifestyle photo"></figure>
  <section class="title-block">
    <p class="eyebrow" id="eyebrow">TORONTO</p>
    <h1 id="headline">Ableton<br>Springs<br>&amp; Spa</h1>
    <p class="description" id="description" hidden></p>
    <p class="cta" id="cta" hidden></p>
  </section>
  <div class="benefits" id="features" aria-label="Product or campaign highlights"></div>
</main>
</body>
</html>
