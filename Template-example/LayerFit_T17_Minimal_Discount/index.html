<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LayerFit T17 — Minimal Discount</title>
<link rel="stylesheet" href="styles.css"><script src="script.js" defer></script>
</head>
<body>
<main id="creative" class="creative" data-format="story" aria-label="Static promotion ad">
  <section class="offer-copy">
    <p id="discount" class="discount">25% OFF</p>
    <h1 id="headline" class="headline">EVERYDAY<br>ESSENTIALS</h1>
    <p id="description" class="description">A SPECIAL OFFER ON SELECTED PRODUCTS.</p>
  </section>
  <div class="product-wrap">
    <div class="stage-shadow" aria-hidden="true"></div>
    <img id="productImage" src="assets/demo-tumbler.svg" alt="Sample product, for template demonstration only">
  </div>
  <div class="bottom-copy">
    <p id="finePrint" class="fineprint">DEMO OFFER ONLY — REPLACE WITH VERIFIED TERMS BEFORE PUBLISHING.</p>
    <p id="brand" class="brand">LAYERFIT</p>
  </div>
</main>
</body>
</html>
