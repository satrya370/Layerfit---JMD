<!doctype html>
<html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T22 — Editorial Sale</title><link rel="stylesheet" href="styles.css"><script defer src="script.js"></script></head>
<body><main id="creative" class="creative" data-format="square">
  <div class="topline"><span id="brand">LAYERFIT</span><span id="campaignLabel">DE SELECTIE / PRODUCT A</span></div>
  <div class="sale-copy">
    <p class="eyebrow" id="eyebrow">EEN SPECIALE AANBIEDING</p>
    <div class="amount"><strong id="discountNumber">30</strong><span class="percent">%</span></div>
    <div class="offer-word" id="discountWord">KORTING</div>
    <h1 id="headline">Een mooie deal.</h1>
    <p class="description" id="description">Ontdek Product A met comfortabel materiaal en een minimalistisch ontwerp.</p>
    <p class="cta" id="cta">BEKIJK DE ACTIE <span aria-hidden="true">↗</span></p>
  </div>
  <div class="photo-zone"><img id="productImage" src="assets/demo-product.jpg" alt="Voorbeeldproduct" /></div>
  <div class="bottomline"><span id="finePrint">Actievoorwaarden zijn van toepassing.</span><span id="demoWarning">DEMO · GEEN ECHTE ACTIE</span></div>
</main></body></html>
